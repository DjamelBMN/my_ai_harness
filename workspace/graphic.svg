<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#ffe3ec"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff85a1"/>
      <stop offset="50%" stop-color="#ffb3c6"/>
      <stop offset="100%" stop-color="#ff7597"/>
    </linearGradient>
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>

  <ellipse cx="200" cy="320" rx="160" ry="25" fill="#e2e8f0" filter="url(#shadow)"/>
  <ellipse cx="200" cy="317" rx="145" ry="20" fill="#f8fafc"/>

  <ellipse cx="200" cy="285" rx="110" ry="15" fill="#cbd5e1"/>

  <path d="M 100,280 C 100,280 110,200 110,190 L 290,190 C 290,200 300,280 300,280 C 300,300 100,300 100,280 Z" fill="url(#cakeGrad)" filter="url(#shadow)"/>

  <path d="M 110,190 Q 130,220 150,195 Q 170,230 190,195 Q 210,225 230,195 Q 250,230 270,195 Q 285,220 290,190 L 290,190 C 290,200 300,280 300,280 C 300,300 100,300 100,280 C 100,280 110,200 110,190 Z" fill="url(#frostingGrad)"/>

  <circle cx="140" cy="240" r="6" fill="#ff4d6d"/>
  <circle cx="180" cy="260" r="6" fill="#ffb703"/>
  <circle cx="220" cy="245" r="6" fill="#3a86ff"/>
  <circle cx="260" cy="255" r="6" fill="#ff4d6d"/>

