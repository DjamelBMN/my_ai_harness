  <path d="M 190,130 L 210,140 L 210,150 L 190,140 Z" fill="#f72585"/>
  <path d="M 190,160 L 210,170 L 210,180 L 190,170 Z" fill="#f72585"/>

  <line x1="200" y1="110" x2="200" y2="100" stroke="#333333" stroke-width="3" stroke-linecap="round"/>

  <path d="M 200,95 Q 215,80 200,55 Q 185,80 200,95 Z" fill="#ff9f1c" filter="url(#shadow)"/>
