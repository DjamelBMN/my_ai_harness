<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur Kilomètres / Miles</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-light: #6b7280;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .converter-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--text-color);
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .info-text {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-light);
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="converter-container">
        <h1>Convertisseur d'Unités</h1>
        
        <div class="input-group">
            <label for="km">Kilomètres (km)</label>
            <input type="number" id="km" placeholder="Entrez des kilomètres" step="any">
        </div>

        <div class="input-group">
            <label for="miles">Miles (mi)</label>
            <input type="number" id="miles" placeholder="Entrez des miles" step="any">
        </div>

        <div class="info-text">
            1 km ≈ 0.621371 miles
        </div>
    </div>

    <script>
        const kmInput = document.getElementById('km');
        const milesInput = document.getElementById('miles');

        const KM_TO_MILES = 0.621371192237334;

        kmInput.addEventListener('input', () => {
            const kmValue = parseFloat(kmInput.value);
            if (isNaN(kmValue)) {
                milesInput.value = '';
            } else {
                milesInput.value = (kmValue * KM_TO_MILES).toFixed(4);
            }
        });

        milesInput.addEventListener('input', () => {
            const milesValue = parseFloat(milesInput.value);
            if (isNaN(milesValue)) {
                kmInput.value = '';
            } else {
                kmInput.value = (milesValue / KM_TO_MILES).toFixed(4);
            }
        });
    </script>

</body>
</html>
