<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Mathématiques - Expérience Premium</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --border-color: rgba(255, 255, 255, 0.1);
            --transition-speed: 0.3s;
        }

        body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-primary: #0284c7;
            --accent-secondary: #6366f1;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            text-align: center;
            backdrop-filter: blur(8px);
            transition: background-color var(--transition-speed), border-color var(--transition-speed), box-shadow var(--transition-speed);
            position: relative;
        }

        .header-actions {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .theme-toggle-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .theme-toggle-btn:hover {
            background-color: var(--border-color);
            transform: scale(1.05);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
            transition: color var(--transition-speed);
        }

        .math-formula {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1.1rem;
            color: var(--accent-primary);
            margin-bottom: 24px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Bouton de bascule de thème -->
        <div class="header-actions">
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Changer le mode d'affichage">
                <span id="theme-icon">☀️</span>
            </button>
        </div>

        <h1>Portail Mathématique</h1>
        <p>Explorez les concepts avancés, résolvez des équations complexes et profitez d'une interface optimisée pour l'étude et la rigueur scientifique.</p>
        
        <div class="math-formula">
            $$\int_{-\infty}^{\infty} e^{-x^2} dx = \sqrt{\pi}$$
        </div>

        <button class="btn-primary" onclick="alert('Accès aux chapitres en cours de chargement...')">Commencer la session</button>
    </div>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const body = document.body;

        // Écouteur d'événement pour basculer le mode clair/sombre
        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            
            // Changement dynamique de l'icône du bouton
            if (body.classList.contains('light-mode')) {
                themeIcon.textContent = '🌙';
            } else {
                themeIcon.textContent = '☀️';
            }
        });
    </script>
</body>
</html>
