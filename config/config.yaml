default_provider: ollama

execution:
  mode: mono
  max_parallel_agents: 1

profiles:
  free:
    mode: mono
    max_parallel_agents: 1
    max_retries: 3
    backoff: true
    circuit_breaker: true
    fallback_enabled: false
    cooldown_after_429: 60

  balanced:
    mode: multi
    max_parallel_agents: 2
    max_retries: 3
    backoff: true
    circuit_breaker: true
    fallback_enabled: true
    cooldown_after_429: 45

  powerful:
    mode: multi
    max_parallel_agents: 4
    max_retries: 4
    backoff: true
    circuit_breaker: true
    fallback_enabled: true
    cooldown_after_429: 30

openai:
  enabled: true
  model: "gpt-5-mini"

providers:
  fallback_enabled: true
  cooldown_after_429: 60
  ollama:
    enabled: true
    model: "qwen3:1.7b"
  gemini:
    enabled: true
    model: "gemini-3.5-flash-lite"
  gemini_flash_lite:
    enabled: true
    model: "gemini-3.5-flash-lite"
  mistral:
    enabled: true
    model: "mistral-small-latest"
  claude:
    enabled: false

agents:
  coder:
    provider: gemini
  tester:
    provider: gemini_flash_lite
  reviewer:
    provider: gemini
  researcher:
    provider: gemini_flash_lite

# Préférences par intention. Le routeur retombe sur le provider sélectionné si
# le provider préféré n'est pas présent ou n'est pas configuré pour cette session.
routing:
  general_question:simple: gemini_flash_lite
  general_question:complex: gemini
  research:simple: gemini_flash_lite
  research:complex: gemini
  file_analysis:complex: gemini
  coding:complex: openai
  testing:complex: gemini
  review:complex: openai

# Feature flags pour les 5 briques agentiques industrielles
features:
  closed_loop_tdd: true
  independent_critic: true
  backtracking: true
  reflective_memory: true
  dynamic_browser: true
  multi_agent_hierarchy: true
  compile_autofix: true
  live_activity_panel: true
  math_tikz_figures: true
